name: Betting bot

# Paper-money Sportsbet 1X2 bot (src/worldcup/betting/bot.py). Each run
# does one task, verifies the hash-chained ledger, commits ledger/ back to
# this repo, and (bet, settle) republishes the site's bankroll.json.
#
# Schedule (UTC). Locked rules v1 (2026-10-26): flat $10, min edge 3%,
# no prices above 6.0.
#   bet     daily 06:00   one decision per event, at the first pull inside 48h
#   close   hourly :05    0 credits unless an open bet kicks off within 90 min;
#                         idle runs stop after checkout (scripts/close_due.py)
#   settle  Mon 12:00     ingest + Elo update + settle
#
# Credit budget (free tier, 500/month, SHARED with the FPL project's key).
# Odds cost 1 credit per call (1 region x 1 market); /sports and /events
# are free.
#   bet:    1 credit per active intl key per day, so 30 to 120 a month.
#   close:  1 credit per sport per kickoff slot with open bets, up to ~25 a
#           month (~75 with a double window).
#   settle: 0 credits (results come from martj42).
#   Expected 60 to 200 a month; the bot refuses to pull below 50 remaining.
#
# Secrets: ODDS_API_KEY (Odds API), MALTYSNACK_PUSH_TOKEN (site push).
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "5 * * * *"
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      task:
        description: "bet, close or settle"
        type: choice
        options: [bet, close, settle]
        default: bet
      dry:
        description: "price and log only, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: betting-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Scheduled runs map their cron to a task; manual runs use the input.
      TASK: ${{ github.event.schedule == '0 6 * * *' && 'bet' || github.event.schedule == '5 * * * *' && 'close' || github.event.schedule == '0 12 * * 1' && 'settle' || inputs.task }}
      DRY: ${{ inputs.dry && '--dry' || '' }}
    steps:
      - name: Checkout worldcup
        uses: actions/checkout@v4

      - name: Anything to do?
        # Hourly close runs are idle outside match days; stop before installing anything.
        id: gate
        run: echo "go=$([ "$TASK" != close ] && echo 1 || python3 scripts/close_due.py)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.gate.outputs.go == '1'
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        if: steps.gate.outputs.go == '1'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.gate.outputs.go == '1'
        run: uv sync

      - name: Verify ledger before
        if: steps.gate.outputs.go == '1'
        run: uv run worldcup-verify-ledger

      - name: Pull results and rebuild Elo
        # bet needs current ratings, settle needs results. The DB is
        # gitignored, so every such run rebuilds it from martj42.
        if: steps.gate.outputs.go == '1' && env.TASK != 'close'
        run: |
          rm -f data/raw/matches.csv data/raw/goalscorers.csv data/raw/shootouts.csv
          uv run worldcup-ingest
          uv run worldcup-elo

      - name: Run bot
        if: steps.gate.outputs.go == '1'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run worldcup-bot "$TASK" $DRY

      - name: Verify ledger after
        if: steps.gate.outputs.go == '1'
        run: uv run worldcup-verify-ledger

      - name: Commit ledger (if changed)
        if: steps.gate.outputs.go == '1' && env.DRY == ''
        run: |
          git config user.name  "worldcup-bot"
          git config user.email "bot@maltysnack.local"
          git add ledger
          if git diff --cached --quiet; then
            echo "Ledger unchanged."
          else
            git commit -m "bot: $TASK $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Checkout maltysnack site
        if: env.DRY == '' && env.TASK != 'close'
        uses: actions/checkout@v4
        with:
          repository: Maltysnack/Maltysnack.github.io
          path: site
          token: ${{ secrets.MALTYSNACK_PUSH_TOKEN }}

      - name: Publish bankroll to site (if changed)
        if: env.DRY == '' && env.TASK != 'close'
        run: |
          uv run python scripts/export_site_v2.py site/projects/worldcup
          cd site
          git config user.name  "worldcup-bot"
          git config user.email "bot@maltysnack.local"
          git add projects/worldcup/bankroll.json projects/worldcup/capsule.json projects/worldcup/elo.json
          # generated_at changes daily; only publish when the numbers do.
          if git diff --cached -U0 | grep '^[+-] ' | grep -vq '"generated_at"'; then
            git commit -m "worldcup: bankroll update ($TASK)"
            git push
          else
            echo "No bankroll changes to publish."
          fi
