name: Betting bot

# Paper-money 1X2 bot against Sportsbet prices (src/worldcup/betting/bot.py). Each run
# does one task, verifies the hash-chained ledger, and commits ledger/ (and,
# for bet and settle, site_data/) back to this repo.
#
# Schedule (UTC). Locked rules v1 (2026-10-26): flat $10, min edge 3%,
# no prices above 6.0.
# Runs only on FIFA men's window days; nothing starts between windows.
# GitHub cron has no year, so the day ranges below are the union of the 2026
# and 2027 windows (FIFA calendar: 21 Sep-6 Oct and 9-17 Nov 2026; 22-30 Mar,
# 7-15 Jun, 20 Sep-5 Oct and 8-16 Nov 2027). Recheck every year and add
# tournaments (Euro and Copa 2028) once dated.
#   bet     06:00 on window days   one decision per event, at the first pull inside 48h
#   close   :17 and :47, 11-21 UTC on window days (covers 14:00 to 21:00
#           kickoffs; GitHub drops many runs, so two an hour), idle runs stop
#           after checkout (scripts/close_due.py), 0 credits
#   settle  12:00 on window days and 2 days after: ingest + Elo update +
#           settle + title odds (Euro/Copa 2028, WC 2030)
#
# Credit budget (free tier, 500/month).
# Odds cost 1 credit per call (1 region x 1 market); /sports and /events
# are free.
#   bet:    1 credit per active intl key per window day, about 45 days a year.
#   close:  1 credit per sport per kickoff slot with open bets.
#   settle: 0 credits (results come from martj42).
#   The bot refuses to pull below 50 remaining.
#
# Secrets: ODDS_API_KEY (Odds API). Bet and settle runs export the site data
# to site_data/ in this repo.
on:
  schedule:
    # bet
    - cron: "0 6 22-31 3 *"
    - cron: "0 6 7-15 6 *"
    - cron: "0 6 20-30 9 *"
    - cron: "0 6 1-6 10 *"
    - cron: "0 6 8-17 11 *"
    # close
    - cron: "17,47 11-21 22-31 3 *"
    - cron: "17,47 11-21 7-15 6 *"
    - cron: "17,47 11-21 20-30 9 *"
    - cron: "17,47 11-21 1-6 10 *"
    - cron: "17,47 11-21 8-17 11 *"
    # settle
    - cron: "0 12 24-31 3 *"
    - cron: "0 12 1-2 4 *"
    - cron: "0 12 9-17 6 *"
    - cron: "0 12 22-30 9 *"
    - cron: "0 12 1-8 10 *"
    - cron: "0 12 10-19 11 *"
  workflow_dispatch:
    inputs:
      task:
        description: "bet, close or settle"
        type: choice
        options: [bet, close, settle]
        default: bet
      dry:
        description: "price and log only, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: betting-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Scheduled runs map their cron to a task; manual runs use the input.
      TASK: ${{ startsWith(github.event.schedule, '0 6 ') && 'bet' || startsWith(github.event.schedule, '17,47 ') && 'close' || startsWith(github.event.schedule, '0 12 ') && 'settle' || inputs.task }}
      DRY: ${{ inputs.dry && '--dry' || '' }}
    steps:
      - name: Checkout worldcup
        uses: actions/checkout@v4

      - name: Anything to do?
        # Close runs with no bet near kickoff are idle; stop before installing anything.
        id: gate
        run: echo "go=$([ "$TASK" != close ] && echo 1 || python3 scripts/close_due.py)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.gate.outputs.go == '1'
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        if: steps.gate.outputs.go == '1'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.gate.outputs.go == '1'
        run: uv sync

      - name: Verify ledger before
        if: steps.gate.outputs.go == '1'
        run: uv run worldcup-verify-ledger

      - name: Pull results and rebuild Elo
        # bet needs current ratings, settle needs results. The DB is
        # gitignored, so every such run rebuilds it from martj42.
        if: steps.gate.outputs.go == '1' && env.TASK != 'close'
        run: |
          rm -f data/raw/matches.csv data/raw/goalscorers.csv data/raw/shootouts.csv
          uv run worldcup-ingest
          uv run worldcup-elo

      - name: Title odds
        if: steps.gate.outputs.go == '1' && env.TASK == 'settle' && env.DRY == ''
        run: uv run python -m worldcup.title_odds

      - name: Run bot
        if: steps.gate.outputs.go == '1'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run worldcup-bot "$TASK" $DRY

      - name: Verify ledger after
        if: steps.gate.outputs.go == '1'
        run: uv run worldcup-verify-ledger

      - name: Export site data
        if: steps.gate.outputs.go == '1' && env.DRY == '' && env.TASK != 'close'
        run: uv run python scripts/export_site_v2.py site_data

      - name: Commit ledger and site data (if changed)
        if: steps.gate.outputs.go == '1' && env.DRY == ''
        run: |
          git config user.name  "worldcup-bot"
          git config user.email "bot@maltysnack.local"
          git add ledger data/title_odds.json data/fixtures.json site_data
          # generated_at changes daily; only commit when something else does.
          if ! git diff --cached -U0 | grep '^[+-] ' | grep -vq '"generated_at"'; then
            echo "Nothing changed."
          else
            git commit -m "bot: $TASK $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
