name: Refresh predictions

# Daily refresh: re-ingest match data, rebuild Elo, regenerate the
# bracket + simulation JSONs, and commit them to the maltysnack site
# repo so the public page picks up new results automatically.
#
# Schedule: every day at 06:00 UTC (after most evening matches finish).
# Also runnable on demand via the workflow_dispatch button.
#
# Required secrets (configure once in repo settings):
#   MALTYSNACK_PUSH_TOKEN  - personal access token with `repo` scope
#                            for the Maltysnack/Maltysnack.github.io repo
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worldcup
        uses: actions/checkout@v4

      - name: Checkout maltysnack site
        uses: actions/checkout@v4
        with:
          repository: Maltysnack/Maltysnack.github.io
          path: site
          token: ${{ secrets.MALTYSNACK_PUSH_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Pull fresh match data
        run: |
          rm -f data/raw/*.csv
          uv run worldcup-ingest

      - name: Refresh WC 2026 squad rosters from Wikipedia
        # Squads are announced rolling through May / early June. Re-fetch
        # daily so new announcements feed the trophy aggregation. Continues
        # on failure so a Wikipedia hiccup doesn't break the whole refresh.
        continue-on-error: true
        run: |
          uv run worldcup-fetch-rosters --refresh
          uv run worldcup-compute-trophies

      - name: Rebuild club season stats from FBref HTML
        # Reads the committed data/raw/fbref/*.html files (saved
        # manually from FBref) and rebuilds the per-club JSON cache.
        # No network calls — refresh the HTML files in-repo when the
        # season ends or club stats need updating.
        run: uv run worldcup-build-fbref-stats

      - name: Refresh club crests/badges from Wikipedia
        continue-on-error: true
        run: uv run worldcup-fetch-club-badges

      - name: Rebuild Elo + bracket + simulation
        run: |
          uv run worldcup-elo
          uv run worldcup-bracket
          uv run worldcup-simulate

      - name: Predict top scorer
        continue-on-error: true
        run: uv run worldcup-predict-top-scorer

      - name: Build live tournament state (group standings + results so far)
        continue-on-error: true
        run: uv run worldcup-build-live-tournament

      - name: Copy JSONs into site repo
        # Site reorg (site commit e2cae15) moved worldcup files into
        # projects/worldcup/ instead of the old flat projects/worldcup-*.json
        # naming. CI writes to the new paths.
        run: |
          mkdir -p site/projects/worldcup
          cp data/bracket.json     site/projects/worldcup/bracket.json
          cp data/simulation.json  site/projects/worldcup/simulation.json
          if [ -f data/top_scorers.json ]; then
            cp data/top_scorers.json site/projects/worldcup/top-scorers.json
          fi
          if [ -f data/live_tournament.json ]; then
            cp data/live_tournament.json site/projects/worldcup/live.json
          fi

      - name: Commit + push site updates (if changed)
        working-directory: site
        run: |
          git config user.name  "worldcup-bot"
          git config user.email "bot@maltysnack.local"
          # Stage any of these that exist; commit only if there are changes
          for f in projects/worldcup/bracket.json projects/worldcup/simulation.json projects/worldcup/top-scorers.json projects/worldcup/live.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "worldcup: nightly auto-refresh"
            git push
          fi
