name: Refresh predictions

# Manual refresh: re-ingest match data, rebuild Elo, regenerate the
# bracket + simulation JSONs, and commit them to the maltysnack site
# repo so the public page picks up new results.
#
# Daily cron disabled 2026-10-23 (post-tournament pivot). Run on demand
# via the workflow_dispatch button.
#
# Required secrets (configure once in repo settings):
#   MALTYSNACK_PUSH_TOKEN  - personal access token with `repo` scope
#                            for the Maltysnack/Maltysnack.github.io repo
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worldcup
        uses: actions/checkout@v4

      - name: Checkout maltysnack site
        uses: actions/checkout@v4
        with:
          repository: Maltysnack/Maltysnack.github.io
          path: site
          token: ${{ secrets.MALTYSNACK_PUSH_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Pull fresh match data
        run: |
          rm -f data/raw/*.csv
          uv run worldcup-ingest

      - name: Rebuild Elo (always — keeps DB current for post-tournament analysis)
        run: uv run worldcup-elo

      - name: Rebuild bracket + simulation (skipped if frozen)
        # data/.frozen is created by worldcup-freeze-prediction (run by
        # hand the night before kickoff). When present, the public
        # prediction is locked: we keep ingesting match data so the DB
        # stays current, but the JSONs the site reads do NOT change.
        run: |
          if [ -f data/.frozen ]; then
            echo "data/.frozen present — skipping prediction rebuild."
            cat data/.frozen
          else
            uv run worldcup-bracket
            uv run worldcup-simulate
          fi

      - name: Copy JSONs into site repo
        # Site reorg (site commit e2cae15) moved worldcup files into
        # projects/worldcup/. If data/.frozen is present we publish the
        # archived -prediction.json files (created by freeze_prediction.py);
        # otherwise we publish the live JSONs as normal.
        run: |
          mkdir -p site/projects/worldcup
          if [ -f data/.frozen ]; then
            cp data/bracket-prediction.json     site/projects/worldcup/bracket.json
            cp data/simulation-prediction.json  site/projects/worldcup/simulation.json
            if [ -f data/top_scorers-prediction.json ]; then
              cp data/top_scorers-prediction.json site/projects/worldcup/top-scorers.json
            fi
          else
            cp data/bracket.json     site/projects/worldcup/bracket.json
            cp data/simulation.json  site/projects/worldcup/simulation.json
            if [ -f data/top_scorers.json ]; then
              cp data/top_scorers.json site/projects/worldcup/top-scorers.json
            fi
          fi

      - name: Commit + push site updates (if changed)
        working-directory: site
        run: |
          git config user.name  "worldcup-bot"
          git config user.email "bot@maltysnack.local"
          # Stage any of these that exist; commit only if there are changes
          for f in projects/worldcup/bracket.json projects/worldcup/simulation.json projects/worldcup/top-scorers.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "worldcup: nightly auto-refresh"
            git push
          fi
