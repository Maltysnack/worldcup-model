[project]
name = "worldcup"
version = "0.1.0"
description = "Predicting the 2026 FIFA World Cup via Monte Carlo simulation."
readme = "README.md"
authors = [
    { name = "maltysnack", email = "39046911+Maltysnack@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "duckdb>=1.5.2",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "requests>=2.33.1",
]

[project.scripts]
worldcup-ingest = "worldcup.ingest:main"
worldcup-elo = "worldcup.elo:main"
worldcup-bracket = "worldcup.bracket:main"
worldcup-simulate = "worldcup.simulator:main"
worldcup-backtest = "worldcup.backtest:main"
worldcup-backtest-tournament = "worldcup.tournament_backtest:main"
worldcup-compare-profiles = "worldcup.compare_profiles:main"
worldcup-iterate-profiles = "worldcup.iterate_profiles:main"
worldcup-continental-backtest = "worldcup.continental_backtest:main"
worldcup-freeze-prediction = "worldcup.freeze_prediction:main"
worldcup-fetch-rosters = "worldcup.wiki_rosters:main"
worldcup-compute-trophies = "worldcup.compute_trophies:main"
worldcup-fetch-club-stats = "worldcup.club_season_stats:main"
worldcup-predict-top-scorer = "worldcup.top_scorer:main"
worldcup-fetch-club-badges = "worldcup.club_badges:main"
worldcup-build-historical-corpus = "worldcup.historical_corpus:main"
worldcup-friendly-diagnostic = "worldcup.friendly_diagnostic:main"
worldcup-fit-friendly-calibration = "worldcup.friendly_calibration:main"
worldcup-fetch-market-odds = "worldcup.market_odds:main"
worldcup-build-live-tournament = "worldcup.live_tournament:main"
worldcup-roster-flip-dryrun = "worldcup.roster_flip_dryrun:main"
worldcup-chaos-investigation = "worldcup.chaos_investigation:main"
worldcup-wc2022-evaluation = "worldcup.wc2022_evaluation:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"
